name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  security-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local Supabase
        run: npx supabase start
      - name: Export local test configuration
        shell: bash
        run: |
          npx supabase status -o env > supabase-status.env
          set -a
          source supabase-status.env
          set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "OPENROUTER_API_KEY=local-e2e-placeholder"
            echo "E2E_USER_EMAIL=e2e@example.test"
            echo "E2E_USER_PASSWORD=LocalE2E-Only-2026!"
          } >> "$GITHUB_ENV"
      - name: Create local E2E user
        shell: bash
        run: |
          curl --silent --show-error --fail \
            --request POST "$SUPABASE_URL/auth/v1/admin/users" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{"email":"e2e@example.test","password":"LocalE2E-Only-2026!","email_confirm":true}' \
            --output /dev/null
      - name: Test database policies
        run: npm run test:db
      - name: Run browser and API integration tests
        run: npx playwright test
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  deploy:
    needs: [ci, security-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
      - name: Verify PRODUCTION_URL is set
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::PRODUCTION_URL repository variable is not set (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
      - name: Smoke check production
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          for path in / /auth/signin /api/health; do
            echo "Smoke check: $PRODUCTION_URL$path"
            curl --fail --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 30 "$PRODUCTION_URL$path"
          done
